name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --tag us-central1-docker.pkg.dev/kabes-maybes/kabes-maybes/api:latest \
            .

      - name: Push image
        run: |
          docker push us-central1-docker.pkg.dev/kabes-maybes/kabes-maybes/api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update kabes-maybes-api \
            --region us-central1 \
            --project kabes-maybes \
            --remove-secrets GROQ_API_KEY \
            --quiet || true
          gcloud run deploy kabes-maybes-api \
            --image us-central1-docker.pkg.dev/kabes-maybes/kabes-maybes/api:latest \
            --region us-central1 \
            --project kabes-maybes \
            --min-instances 1 \
            --set-env-vars GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --quiet

      # Image retention is handled by an Artifact Registry cleanup policy on the
      # repository itself, not by a step here. A previous prune step filtered on
      # `tags!~latest`, which silently matched zero images on every run (the
      # `tags` field is not available to --filter on `images list`), and its
      # trailing `|| true` hid the no-op. The repository grew to 94 versions /
      # 67 GiB before anyone noticed.
      #
      # The policy keeps the 5 most recent versions and deletes anything else
      # older than 7 days. Inspect or re-apply it with:
      #   gcloud artifacts repositories describe kabes-maybes \
      #     --location=us-central1 --format='yaml(cleanupPolicies)'
      #
      # `docs/gcp_cost_breakdown.py` reports whether the policy is still present
      # and flags the repository if it is not.
