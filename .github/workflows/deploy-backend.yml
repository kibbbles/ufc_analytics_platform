name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --tag us-central1-docker.pkg.dev/kabes-maybes/kabes-maybes/api:latest \
            .

      - name: Push image
        run: |
          docker push us-central1-docker.pkg.dev/kabes-maybes/kabes-maybes/api:latest

      # DATABASE_URL, ALLOWED_ORIGINS and GROQ_API_KEY are Secret Manager
      # references set once on the service, and a deploy keeps them. Do not
      # pass secrets here: --set-env-vars replaces every plain env var and
      # stores the value in plain text in each revision's config.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy kabes-maybes-api \
            --image us-central1-docker.pkg.dev/kabes-maybes/kabes-maybes/api:latest \
            --region us-central1 \
            --project kabes-maybes \
            --min-instances 1 \
            --quiet

      # Old images are removed by an Artifact Registry cleanup policy on the
      # repository (keep the 10 most recent versions, never delete a tagged one),
      # not by this workflow. The prune step that used to run here failed on
      # every delete with IAM_PERMISSION_DENIED and only warned, so nothing was
      # ever removed.
